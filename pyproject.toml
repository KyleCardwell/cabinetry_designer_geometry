[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cabinetry-designer-geometry"
version = "0.1.0"
description = "Deterministic geometry engine for cabinetry DXF generation"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.3.0",
    "shapely>=2.0.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
server = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
